<style>

a,button,summary,select{touch-action:manipulation}@media(hover:none){body{cursor:pointer}}

.steps{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:22px 0}

label{display:block;font-weight:700;font-size:.88rem;margin:12px 0 4px}
input,select,textarea{border:1px solid #cfc8b0;border-radius:10px;padding:9px 12px;background:#fff;width:100%}
.filters{display:grid;gap:10px;grid-template-columns:2fr 1fr;margin-bottom:14px}

.two{display:grid;gap:18px;grid-template-columns:1.4fr 1fr;align-items:start}
.sum div{display:flex;justify-content:space-between;padding:4px 0;gap:10px}
.sum .tot{border-top:2px dashed var(--line);margin-top:6px;padding-top:10px;font-weight:800;font-size:1.1rem}
.tl{list-style:none;padding:0;margin:10px 0 0}.tl li{padding:4px 0 4px 26px;position:relative}
.tl li:before{content:"";position:absolute;left:4px;top:11px;width:12px;height:12px;border-radius:50%;background:var(--g7)}
.tl li.n{color:var(--mut)}.tl li.n:before{background:#d6d0ba}
.bar2{height:8px;background:var(--g2);border-radius:9px;overflow:hidden}.bar2 i{display:block;height:100%;background:var(--o)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px}.tabs a{padding:7px 14px;border-radius:99px;background:#fff;border:1px solid var(--line);text-decoration:none;font-weight:700;font-size:.88rem;white-space:nowrap}.tabs a.on{background:var(--g7);color:#fff;border-color:var(--g7)}
.err{color:var(--red);font-size:.88rem;margin-top:6px}
.auth{max-width:420px;margin:20px auto}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--g9);color:#fff;padding:11px 20px;border-radius:12px;display:none;z-index:20;max-width:90vw}#toast.er{background:var(--red)}
.empty{text-align:center;padding:40px 16px;color:var(--mut)}
.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:30;padding:16px}.modal.on{display:grid}.modal>div{background:#fff;border-radius:16px;padding:22px;max-width:440px;width:100%}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:20px 16px 40px}
@media(max-width:760px){.hero,.two,.filters{grid-template-columns:1fr}.hero{padding:26px 18px}.ph.big{height:200px}}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-weight:700;font-size:.85rem;cursor:pointer;white-space:nowrap}.chip.on{background:var(--g7);color:#fff;border-color:var(--g7)}
.heart{position:absolute;top:22px;right:22px;z-index:2;width:34px;height:34px;border-radius:50%;border:0;background:#fffd;cursor:pointer;display:grid;place-items:center;color:var(--mut)}.heart.on{color:var(--red)}
.skel{height:210px;border-radius:14px;background:linear-gradient(90deg,#eee8d4 25%,#f7f2e2 50%,#eee8d4 75%);background-size:200% 100%;animation:sh 1.1s infinite}@keyframes sh{to{background-position:-200% 0}}
.fi{animation:fi .3s}@keyframes fi{from{opacity:0;transform:translateY(6px)}}
.drawer{position:fixed;inset:0;display:none;z-index:25}.drawer.on{display:block}.ov{position:absolute;inset:0;background:#0006}.dp{position:absolute;right:0;top:0;bottom:0;width:min(380px,100%);background:#fff;padding:18px;overflow:auto;animation:sl .25s}@keyframes sl{from{transform:translateX(30px);opacity:0}}
details.faq{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:8px}details.faq summary{cursor:pointer;font-weight:700}details.faq[open]{border-color:var(--g7)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
// Konfigurasi Supabase
const SUPABASE_URL = "https://gufqfhpcijjfkltcphey.supabase.co";
const SUPABASE_KEY = "sb_publishable_1IoJkd2xWCSV8ukj8IIYjQ_QSBJRi5F";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const IMG={}; 
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rp=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);

const ICON={makanan:'<path d="M8 28h48a24 24 0 0 1-48 0z"/><path d="M22 18c0-5 6-5 6-10M36 18c0-5 6-5 6-10"/>',minuman:'<path d="M16 12h32l-4 44H20z"/><path d="M16 24h32"/>',"kebutuhan kos":'<path d="M8 32 32 10l24 22M16 28v26h32V28"/>',"alat tulis":'<path d="M10 54l4-14L42 12l10 10-28 28z"/>',"kebutuhan harian":'<path d="M14 20h36l4 36H10zM24 28v-8a8 8 0 0 1 16 0v8"/>'};
const TONE={makanan:['#fde6cf','#c4600f'],minuman:['#d6ecf5','#1d6f8f'],"kebutuhan kos":['#e5e0f4','#5b4aa0'],"alat tulis":['#fbe9a8','#8a6b00'],"kebutuhan harian":['#d9efdf','#1b5e3b']};

let S = { me: null, cart: [], pref: null, orders: [], reviews: [], users: [], products: [], pts:["Titik Kumpul Gerbang Sekaran","Titik Kumpul Gunungpati","Titik Kumpul Kos Area Sekaran"], vouchers: [], batches: [] };

async function initDB() {
  const { data: users } = await sb.from('users').select('*');
  const { data: products } = await sb.from('products').select('*');
  const { data: batches } = await sb.from('batches').select('*');
  const { data: orders } = await sb.from('orders').select('*');
  const { data: vouchers } = await sb.from('vouchers').select('*');
  const { data: reviews } = await sb.from('reviews').select('*');

  if (!users || users.length === 0) {
    // Seed default data if empty
    const raw=[["Nasi Ayam Geprek","makanan",18000,"Warung Makan Semarang Bawah"],["Mie Ayam Bakso","makanan",15000,"Warung Makan Semarang Bawah"],["Nasi Goreng Spesial","makanan",16000,"Warung Makan Semarang Bawah"],["Soto Ayam","makanan",14000,"Warung Makan Semarang Bawah"],["Lumpia Semarang (3 pcs)","makanan",20000,"Warung Makan Semarang Bawah"],

    ["Sapu Lantai","kebutuhan kos",22000,"Toko Kebutuhan Kos"],["Gantungan Baju (isi 10)","kebutuhan kos",15000,"Toko Kebutuhan Kos"],["Lampu LED 9 Watt","kebutuhan kos",20000,"Toko Kebutuhan Kos"],["Colokan Terminal 4 Lubang","kebutuhan kos",45000,"Toko Kebutuhan Kos"],

    ["Sabun Mandi Cair 450 ml","kebutuhan harian",21000,"Minimarket Harian"],["Deterjen Bubuk 800 g","kebutuhan harian",19000,"Minimarket Harian"],["Tisu Wajah 250 lembar","kebutuhan harian",12000,"Minimarket Harian"],["Mie Instan (5 pcs)","kebutuhan harian",17000,"Minimarket Harian"]];
    
    const defUsers=[{id:1,name:'Admin TipNess',email:'admin@tipness.id',pass:'admin123',phone:'08120000001',role:'admin',nim:'',vs:'ok',"on":true},{id:2,name:'Rizky Pratama',email:'jastiper@tipness.id',pass:'jastiper123',phone:'08120000002',role:'jastiper',nim:'',vs:'ok',"on":true},{id:3,name:'Salsa Putri',email:'mahasiswa@tipness.id',pass:'mahasiswa123',phone:'08120000003',role:'customer',nim:'',vs:'none',"on":true}];
    const defProducts=raw.map((p,i)=>({id:i,name:p[0],cat:p[1],price:p[2],merchant:p[3],max:5,"on":i!==7}));
    const H=36e5,now=Date.now();
    const defBatches=[{id:'TN-001',day:'Besok',dep:'15:00',arr:'17:00',cut:now+20*H,st:'open',min:3,max:12,cost:15000,pt:0,j:null},{id:'TN-002',day:'Hari ini',dep:'16:00',arr:'18:00',cut:now-H,st:'locked',min:3,max:12,cost:15000,pt:1,j:2},{id:'TN-003',day:'Hari ini',dep:'13:00',arr:'15:00',cut:now-4*H,st:'shopping',min:3,max:12,cost:12000,pt:2,j:2}];
    const defVouchers=[{code:'UNNESHEMAT',t:'fixed',v:5000,min:30000,max:0,quota:100,used:0,"on":true,d:'Diskon Rp5.000 min. belanja Rp30.000'},{code:'MAHASISWABARU',t:'pct',v:10,min:20000,max:8000,quota:100,used:0,"on":true,d:'Diskon 10% maks Rp8.000 min. belanja Rp20.000'}];

S.fav=JSON.parse(localStorage.getItem('tn_fav')||'[]');
const saveFav=()=>localStorage.setItem('tn_fav',JSON.stringify(S.fav));

async function saveOrderToDB(o) {
  await sb.from('orders').upsert(o);
}

async function updateDB(table, data, matchCol, matchVal) {
  await sb.from(table).update(data).eq(matchCol, matchVal);
}

const me=()=>S.users.find(u=>u.id===S.me),prod=id=>S.products.find(p=>p.id==id),bt=id=>S.batches.find(b=>b.id===id),usr=id=>S.users.find(u=>u.id==id);
const cnt=b=>S.orders.filter(o=>o.batch===b.id&&!o.cancel).length;
const isOpen=b=>b.st==='open'&&b.cut>Date.now()&&cnt(b)<b.max;
const jastip=s=>Math.max(2000,Math.floor(s*5/100)),ship=(b,extra=1)=>Math.ceil(b.cost/Math.max(cnt(b)+extra,b.min));
const subOf=items=>items.reduce((a,c)=>a+c.q*c.p,0);
function disc(v,sub,sh,jf,ex){if(!v||!v.on||sub<v.min)return 0;let d=v.t==='fixed'?v.v:v.t==='pct'?Math.min(Math.floor(sub*v.v/100),v.max||1e9):sh;return Math.min(d,sub+sh+jf+ex)}
const log=(o,s)=>o.log.push({t:Date.now(),s});
function mkOrder(uid,bid,ids,method='pt'){const b=bt(bid),items=ids.map(([i,q])=>({n:prod(i).name,p:prod(i).price,q,st:'pending',note:''})),sub=subOf(items),jf=jastip(sub),sh=ship(b),ex=method==='dl'?5000:0;
return {code:'TN-'+Math.random().toString(36).slice(2,8).toUpperCase(),uid,batch:bid,pt:b.pt,method,items,sub,jf,sh,ex,dc:0,total:sub+jf+sh+ex,pay:'Transfer bank',paid:false,ready:false,cancel:false,pick:String(Math.floor(Math.random()*1e6)).padStart(6,'0'),note:'',log:[{t:Date.now(),s:'Pesanan dibuat'}]}}

function ph(p,big){const t=TONE[p.cat],s=IMG[p.name];return `<div class="ph ${big?'big':''}" style="background:${t[0]};color:${t[1]}">${s?`<img src="${s}" alt="${esc(p.name)}">`:`<svg viewBox="0 0 64 64" width="${big?110:50}" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[p.cat]}</svg>`}</div>`}

function ask(html,ok,label='Ya, lanjutkan'){$('#mbody').innerHTML=html+`<div class="row mt" style="justify-content:flex-end"><button class="btn o sm" data-act="mx">Batal</button><button class="btn sm" id="mo">${label}</button></div>`;$('#modal').classList.add('on');$('#mo').onclick=()=>{$('#modal').classList.remove('on');ok()}}
let CUR=location.hash.startsWith('#/')?location.hash:'#/',HIST=[];
const go=(h,back)=>{if(!back&&CUR!==h)HIST.push(CUR);CUR=h;try{history.replaceState(null,'',h)}catch(e){}nav();scrollTo(0,0);const a=$('#app');a.classList.remove('fi');void a.offsetWidth;a.classList.add('fi')};
const cartN=()=>S.cart.reduce((a,c)=>a+c.q,0);
function ostat(o){if(o.cancel)return['Dibatalkan','r'];const b=bt(o.batch);if(!o.paid)return['Menunggu pembayaran','o'];if(o.ready)return['Siap diambil',''];return[SL[b.st],b.st==='completed'?'':'o']}
function batchCard(b){const o=isOpen(b),c=cnt(b),pct=Math.min(100,Math.round(c/b.max*100));
return `<a class="card" href="#/b/${b.id}" style="margin:12px 0"><div class="row sp"><div><b>${b.id}</b> <span class="tag ${o?'':'o'}">${o?'Menerima pesanan':SL[b.st]}</span></div><span class="mut">Semarang Bawah ke Sekaran</span></div>
<div class="mut" style="margin:6px 0">${b.day}, berangkat ${b.dep}, estimasi tiba maks ${b.arr}. ${S.pts[b.pt]}.</div>
<div class="row sp"><span class="mut">${c} dari ${b.max} pesanan (min. ${b.min})</span><span class="mut">Estimasi ongkir <b>${rp(ship(b))}</b>/orang</span></div><div class="bar2" style="margin-top:8px"><i style="width:${pct}%"></i></div>${o?`<div class="mut" style="margin-top:6px">Tutup dalam <b data-cd="${b.cut}"></b></div>`:''}</a>`}
const R={};
R.home=()=>{const nb=S.batches.find(isOpen);
return `<section class="hero"><div><h1>Tolong banyak, ambil untung sedikit.</h1><p>Titip belanjaan dari Semarang Bawah ke Sekaran dalam satu batch. Ongkir dibagi bersama, jadi lebih hemat. Kamu memilih jadwal batch dan bersedia menunggu.</p><div class="row mt"><a class="btn" href="#/catalog">Mulai titip</a><a class="btn w" href="#/batches">Lihat batch aktif</a></div></div>
<div class="box"><h3>Simulasi hemat ongkir (estimasi)</h3><label for="sim" style="margin-top:0">Pemesan dalam batch: <span id="simn">6</span></label><input type="range" id="sim" min="1" max="12" value="6" data-chg="sim" style="padding:0"><div class="sum" id="simo"></div></div></section>
<div class="steps"><a class="card" href="#/catalog"><h3>1. Pilih barang</h3><p class="mut">Cari barang kebutuhanmu di katalog Semarang Bawah.</p></a><a class="card" href="#/batches"><h3>2. Pilih jadwal batch</h3><p class="mut">Pesanan dikumpulkan sampai batas waktu, lalu jastiper berbelanja.</p></a><a class="card" href="#/orders"><h3>3. Ambil di titik kumpul</h3><p class="mut">Tunjukkan kode pengambilan saat barang tiba di Sekaran.</p></a></div>

<h2 style="margin-top:26px">Batch terdekat</h2>${nb?batchCard(nb):'<div class="empty">Belum ada batch yang terbuka.</div>'}

async newv(){const c=$('#nv1').value.trim().toUpperCase();if(S.vouchers.some(v=>v.code===c))return toast('Kode sudah ada',1);const t=$('#nv2').value,v=Math.floor(+$('#nv3').value);const vo={code:c,t,v,min:Math.floor(+$('#nv4').value),max:t==='pct'?10000:0,quota:Math.floor(+$('#nv5').value),used:0,"on":true,d:t==='fixed'?'Diskon '+rp(v):t==='pct'?'Diskon '+v+'%':'Gratis ongkir'};await sb.from('vouchers').insert(vo);S.vouchers.push(vo);toast('Voucher ditambahkan');nav()}};

const CH={sim,filt:drawCat,quote,
async ist(e){const o=S.orders.find(x=>x.code===e.dataset.o);o.items[e.dataset.k].st=e.value;log(o,o.items[e.dataset.k].n+': '+ISL[e.value]);await saveOrderToDB(o);toast('Status item diperbarui')},
async inote(e){const o=S.orders.find(x=>x.code===e.dataset.o);o.items[e.dataset.k].note=e.value;await saveOrderToDB(o)},
async role(e){const u=usr(e.dataset.id);u.role=e.value;await updateDB('users',{role:e.value},'id',u.id);toast('Role diubah')}};

document.addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').classList.remove('on');const t=e.target.closest('[data-act]');if(t&&A[t.dataset.act]){e.preventDefault();A[t.dataset.act](t);return}const l=e.target.closest('a[href^="#/"]');if(l){e.preventDefault();go(l.getAttribute('href'))}});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(f){e.preventDefault();F[f.dataset.form](f)}});
document.addEventListener('input',e=>{const c=e.target.dataset.chg;if(c&&['sim','filt'].includes(c))CH[c](e.target)});
document.addEventListener('change',e=>{const c=e.target.dataset.chg;if(c&&CH[c]&&!['sim','filt'].includes(c))CH[c](e.target)});
window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#/')&&location.hash!==CUR)go(location.hash)});

// Mulai aplikasi dengan memuat data dari Supabase
initDB();

setInterval(()=>document.querySelectorAll('[data-cd]').forEach(e=>{const t=Math.floor((e.dataset.cd-Date.now())/1000);e.textContent=t<=0?'ditutup':Math.floor(t/3600)+' j '+String(Math.floor(t%3600/60)).padStart(2,'0')+' m '+String(t%60).padStart(2,'0')+' d'}),1000);
</script>
